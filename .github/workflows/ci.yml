name: Маршрутизация и погодный атлас

on:
  pull_request:
    branches: [main]
  push:
    branches: [Neverrie]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrations:
    name: Routing and weather / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            weather_coverage/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-core.txt -r weather_coverage/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s integration_tests -v
      - name: Generate and validate the routing pilot
        run: |
          python -m snowops demo --case base_snowfall --output "$RUNNER_TEMP/pkc-smoke" --seed 42 --time-limit-s 15
          python -m snowops validate "$RUNNER_TEMP/pkc-smoke/base_snowfall/scenario.json" "$RUNNER_TEMP/pkc-smoke/base_snowfall/O1.plan.json"
      - name: Generate the offline weather demo
        run: |
          python -m compileall -q weather_coverage
          python -m weather_coverage coordinates
          python -m weather_coverage demo
          python -m weather_coverage map --source demo
          test -s weather_coverage/weather_coverage.html
          python -m weather_coverage.heatmap_atlas --help
